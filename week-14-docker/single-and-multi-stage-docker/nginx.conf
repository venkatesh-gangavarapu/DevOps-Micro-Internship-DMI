# nginx.conf — React SPA reference config
# This is already baked into the Dockerfile
# Kept here as a standalone reference

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all routes
    # Without this, direct URL access returns 404
    location / {
        try_files $uri /index.html;
    }

    # Catch-all 404 — also serves index.html
    # React Router handles the actual routing client-side
    error_page 404 /index.html;

    # Cache static assets for 1 year
    # React build hashes filenames so cache busting is automatic
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
