---
# ──────────────────────────────────────────────────────────────────────────────
# roles/nginx/tasks/main.yml
# Install Nginx, deploy virtual-host config, enable site, remove default site.
# ──────────────────────────────────────────────────────────────────────────────

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true


- name: Deploy EpicBook Nginx virtual-host config from template
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable EpicBook site (symlink → sites-enabled)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  notify: Reload nginx

- name: Remove default Nginx site from sites-enabled
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure Nginx is started and enabled at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
