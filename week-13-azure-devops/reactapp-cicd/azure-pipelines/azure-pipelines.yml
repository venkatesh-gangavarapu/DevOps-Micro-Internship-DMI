trigger:
  branches:
    include:
      - main

variables:
  deploy_path: '/var/www/html'
  node_version: '18.x'

stages:

# ─────────────────────────────────────────────
# Stage 1 — Build
# ─────────────────────────────────────────────
- stage: Build
  displayName: "Build React App"
  jobs:
    - job: BuildJob
      displayName: "Install Dependencies + Build"
      pool:
        name: SelfHostedPool
      steps:
        - checkout: self
          displayName: "Checkout source code"

        - task: NodeTool@0
          displayName: "Use Node.js $(node_version)"
          inputs:
            versionSpec: $(node_version)

        - script: node --version && npm --version
          displayName: "Verify Node.js version"

        - script: npm install
          displayName: "Install dependencies (npm install)"

        - script: npm run build
          displayName: "Build React app (npm run build)"

        - publish: $(Build.SourcesDirectory)/build
          artifact: react_build
          displayName: "Publish build/ as artifact react_build"

# ─────────────────────────────────────────────
# Stage 2 — Test
# ─────────────────────────────────────────────
- stage: Test
  displayName: "Run Unit Tests"
  dependsOn: Build
  jobs:
    - job: TestJob
      displayName: "Unit Tests"
      pool:
        name: SelfHostedPool
      steps:
        - checkout: self
          displayName: "Checkout source code"

        - task: NodeTool@0
          displayName: "Use Node.js $(node_version)"
          inputs:
            versionSpec: $(node_version)

        - script: npm install
          displayName: "Install dependencies"

        - script: npm test -- --watchAll=false --passWithNoTests
          displayName: "Run unit tests"
          env:
            CI: true

# ─────────────────────────────────────────────
# Stage 3 — Publish
# ─────────────────────────────────────────────
- stage: Publish
  displayName: "Publish Artifact"
  dependsOn: Test
  jobs:
    - job: PublishJob
      displayName: "Verify Artifact"
      pool:
        name: SelfHostedPool
      steps:
        - download: current
          artifact: react_build
          displayName: "Download react_build artifact"

        - script: |
            echo "=== Artifact contents ==="
            ls -la $(Pipeline.Workspace)/react_build/
            echo ""
            echo "Artifact verified and ready for deployment"
          displayName: "Verify artifact contents"

# ─────────────────────────────────────────────
# Stage 4 — Deploy
# ─────────────────────────────────────────────
- stage: Deploy
  displayName: "Deploy to Nginx VM"
  dependsOn: Publish
  jobs:
    - job: DeployJob
      displayName: "SSH Deploy to VM"
      pool:
        name: SelfHostedPool
      steps:
        - download: current
          artifact: react_build
          displayName: "Download react_build artifact"

        - task: SSH@0
          displayName: "Clear old content from web root"
          inputs:
            sshEndpoint: 'ubuntu-nginx-ssh'
            runOptions: 'inline'
            inline: |
              sudo rm -rf /var/www/html/*
              echo "Web root cleared — ready for fresh deploy"

        - task: CopyFilesOverSSH@0
          displayName: "Copy React build to /var/www/html"
          inputs:
            sshEndpoint: 'ubuntu-nginx-ssh'
            sourceFolder: '$(Pipeline.Workspace)/react_build'
            contents: '**'
            targetFolder: '$(deploy_path)'
            cleanTargetFolder: false
            overwrite: true
            failOnEmptySource: true

        - task: SSH@0
          displayName: "Fix permissions + restart Nginx"
          inputs:
            sshEndpoint: 'ubuntu-nginx-ssh'
            runOptions: 'inline'
            inline: |
              sudo chown -R www-data:www-data /var/www/html
              sudo chmod -R 755 /var/www/html
              sudo systemctl restart nginx
              echo "Permissions fixed. Nginx restarted."

        - task: SSH@0
          displayName: "Verify deployment"
          inputs:
            sshEndpoint: 'ubuntu-nginx-ssh'
            runOptions: 'inline'
            inline: |
              echo "=== Files deployed to /var/www/html ==="
              ls -la /var/www/html
              echo ""
              echo "=== Nginx status ==="
              systemctl is-active nginx
              echo ""
              echo "=== HTTP check ==="
              curl -s -o /dev/null -w "HTTP Status: %{http_code}" http://localhost
              echo ""
              echo "Deployment complete"
